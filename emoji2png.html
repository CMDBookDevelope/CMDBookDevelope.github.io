<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Emoji 重定向</title>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    let emoji = params.get("syn");
    if (!emoji) {
        document.body.innerText = "未提供 emoji 参数";
        return;
    }

    emoji = emoji.replace(/^["']|["']$/g, '');

    fetch("emojiMap.json")
        .then(resp => resp.json())
        .then(emojiMap => {
            let entry = emojiMap[emoji];
            if (!entry) {
                document.body.innerText = "未找到对应 emoji";
                return;
            }

            // 替换短横线
            const name = entry.name.replace(/_/g, "-");
            const emojixUrl = `https://emojipic.cn/Pics/72/apple/${name}_${entry.code}.png`;
            window.location.href = emojixUrl;
        })
        .catch(() => {
            document.body.innerText = "加载 emoji 映射表失败";
        });
};
</script>
</head>
<body>
Redirecting...
</body>
</html>
