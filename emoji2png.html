<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Emoji 重定向</title>
<script>
window.onload = function() {
    // 获取 URL 参数
    const params = new URLSearchParams(window.location.search);
    let emoji = params.get("syn");
    if (!emoji) {
        document.body.innerText = "未提供 emoji 参数";
        return;
    }

    // 移除引号，如果有
    emoji = emoji.replace(/^["']|["']$/g, '');

    // 将 emoji 转换为 code point
    const codePoint = [...emoji].map(c => c.codePointAt(0).toString(16)).join('-');

    // 生成 Twemoji 72x72 PNG 链接
    const url = `https://twemoji.maxcdn.com/v/latest/72x72/${codePoint}.png`;

    // 自动重定向
    window.location.href = url;
};
</script>
</head>
<body>
Redirecting...
</body>
</html>
