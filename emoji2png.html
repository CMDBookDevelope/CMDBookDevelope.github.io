<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Emoji 重定向</title>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    let emoji = params.get("syn");
    if (!emoji) {
        document.body.innerText = "未提供 emoji 参数";
        return;
    }

    emoji = emoji.replace(/^["']|["']$/g, '');

    fetch("emojiMap.json")
        .then(response => response.json())
        .then(emojiMap => {
            let entry = emojiMap[emoji];
            let codePoint;
            let emojixUrl;
            if (entry) {
                emojixUrl = `https://emojipic.cn/Pics/72/apple/${entry.name}_${entry.code}.png`;
                codePoint = entry.code;
            } else {
                // fallback: 用 codepoint 生成 Twemoji
                codePoint = [...emoji].map(c => c.codePointAt(0).toString(16)).join('-');
                emojixUrl = null;
            }

            const twemojiUrl = `https://twemoji.maxcdn.com/v/latest/72x72/${codePoint}.png`;

            if (emojixUrl) {
                fetch(emojixUrl, { method: 'HEAD' })
                    .then(res => {
                        if (res.ok) {
                            window.location.href = emojixUrl;
                        } else {
                            window.location.href = twemojiUrl;
                        }
                    })
                    .catch(() => {
                        window.location.href = twemojiUrl;
                    });
            } else {
                window.location.href = twemojiUrl;
            }
        })
        .catch(() => {
            document.body.innerText = "加载 emoji 映射表失败";
        });
};
</script>
</head>
<body>
Redirecting...
</body>
</html>
