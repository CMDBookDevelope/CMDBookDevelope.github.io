<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Emoji 重定向</title>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    let emoji = params.get("syn");
    if (!emoji) {
        document.body.innerText = "未提供 emoji 参数";
        return;
    }

    emoji = emoji.replace(/^["']|["']$/g, '');
    const codePoint = [...emoji].map(c => c.codePointAt(0).toString(16)).join('-');

    // Emojix 本地路径
    const emojixUrl = `/emojix/${codePoint}.png`;

    // 测试 Emojix 文件是否存在
    fetch(emojixUrl, { method: 'HEAD' })
        .then(res => {
            if (res.ok) {
                window.location.href = emojixUrl;
            } else {
                // 如果没有对应 emoji，就用 Twemoji
                const twemojiUrl = `https://twemoji.maxcdn.com/v/latest/72x72/${codePoint}.png`;
                window.location.href = twemojiUrl;
            }
        })
        .catch(() => {
            const twemojiUrl = `https://twemoji.maxcdn.com/v/latest/72x72/${codePoint}.png`;
            window.location.href = twemojiUrl;
        });
};
</script>
</head>
<body>
Redirecting...
</body>
</html>
