<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Emoji 重定向</title>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    let emoji = params.get("syn");
    if (!emoji) {
        document.body.innerText = "未提供 emoji 参数";
        return;
    }

    emoji = emoji.replace(/^["']|["']$/g, '');

    // 加载 emojiMap.json
    fetch("emojiMap.json")
        .then(response => response.json())
        .then(emojiMap => {
            let entry = emojiMap[emoji];
            if (!entry) {
                document.body.innerText = "未找到对应 emoji";
                return;
            }

            // 构造 Emojipic 苹果风格 PNG URL
            const emojixUrl = `https://emojipic.cn/Pics/72/apple/${entry.name}_${entry.code}.png`;

            // 测试 URL 是否存在
            fetch(emojixUrl, { method: 'GET' })
                .then(res => {
                    if(res.ok) window.location.href = emojixUrl;
                    else document.body.innerText = "Emojipic PNG 不存在";
                })
        })
        .catch(() => {
            document.body.innerText = "加载 emoji 映射表失败";
        });
};
</script>
</head>
<body>
Redirecting...
</body>
</html>
