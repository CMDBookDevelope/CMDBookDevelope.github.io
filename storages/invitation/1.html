<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许佳瑟 & 柴高菲 结婚请柬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 加深的爱心背景 */
        .hearts {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        .heart {
            position: absolute;
            color: #f91943; /* 加深爱心颜色 */
            animation: float 8s infinite linear;
            opacity: 0.4;
            font-size: 24px;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        body {
            font-family: '楷体', cursive;
            background: linear-gradient(135deg, #fff5f5, #ffe6e6);
            color: #5d3b3b;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.92);
        }

        .header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #e0b4b4;
        }

        .names {
            font-size: 2.8em;
            margin: 20px 0;
            letter-spacing: 5px;
            color: #c7375f;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px 0;
        }

        .gallery img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            object-position: center top; /* 修正头部显示 */
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(199, 55, 95, 0.2);
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .details {
            padding: 40px 0;
            text-align: center;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #ffd6e0;
        }

        /* 音乐播放器样式 */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .names {
                font-size: 2em;
            }
            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>
<body bgcolor=white>
    <!-- 动态爱心背景 -->
    <div class="hearts" id="hearts"></div>

    <!-- 音乐播放器 -->
    <div class="music-player" id="musicControl">🎵</div>
    <audio id="bgMusic" loop>
        <source src="1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <header class="header">
            <h1>结婚请柬</h1>
            <div class="names">
                许佳瑟 & 柴高菲
            </div>
        </header>

        <div class="gallery">
            <img src="1.jpg" alt="婚纱照">
            <img src="2.jpg" alt="婚纱照">
            <img src="3.jpg" alt="婚纱照">
            <img src="4.jpg" alt="婚纱照">
            <img src="5.jpg" alt="婚纱照">
        </div>

        <div class="details">
            <div class="info-card">
                <h2>婚礼详情</h2>
                <p>📅 日期：2025年月日</p>
                <p>⏰ 时间：</p>
                <p>🏨 地点：</p>
                <p>📍 地址：</p>
                <p style="margin-top:20px;color:#c7375f;">恭请光临 共鉴良缘</p>
            </div>
        </div>
    </div>

    <script>
        // 生成动态爱心
        function createHearts() {
            const container = document.getElementById('hearts');
            const heartCount = 66;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (15 + Math.random() * 30) + 'px';
                container.appendChild(heart);
            }
        }

        // 音乐播放控制
        const musicControl = document.getElementById('musicControl');
        const bgMusic = document.getElementById('bgMusic');
        
        musicControl.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicControl.textContent = '🎵';
            } else {
                bgMusic.pause();
                musicControl.textContent = '🔇';
            }
        });

        // 首次点击页面自动播放
        document.addEventListener('click', () => {
            bgMusic.play().catch(() => {});
        }, { once: true });

        createHearts();
    </script>
</body>
</html>
